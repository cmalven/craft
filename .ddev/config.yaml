name: your-project-slug
type: craftcms
docroot: web
php_version: "8.4"
webserver_type: nginx-fpm
router_http_port: "80"
router_https_port: "443"
xdebug_enabled: false
additional_hostnames: []
additional_fqdns: []
database:
  type: mysql
  version: "8.4"
nfs_mount_enabled: false
mutagen_enabled: false
use_dns_when_possible: true
composer_version: "2"
web_environment:
    - CLAUDE_CONFIG_DIR=/var/www/html/.claude-ddev
nodejs_version: "24"
